name: build-with-muon
description: A github action that installs a specific version of muon.
author: Stone Tickle <lattis@mochiro.moe>

branding:
  icon: package
  color: gren

inputs:
  version:
    description: The muon version to use.  Can be a string like 0.3.0, a git sha, or edge.
    required: true
    default: edge
  git_url:
    description: The url to git clone muon from
    required: true
    default: https://github.com/muon-build/muon
  msys2_msystem:
    description: |
      If the runner OS is Windows, a MSYS2 runtime can be selected (mingw64, ucrt64, clang64, etc...).
      If not set, Windows native is used (not MSYS2 environment).
    type: string
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: fetch
      shell: bash
      run: |
        set -eux
        cd "$GITHUB_ACTION_PATH"

        if [[ "$INPUTS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]$ ]]; then
          git clone --branch "$INPUTS_VERSION" --depth=1 $INPUTS_GIT_URL
        elif [[ "$INPUTS_VERSION" = edge ]]; then
          git clone --depth=1 "$INPUTS_GIT_URL" muon
        else
          mkdir muon
          cd muon
          git -c init.defaultBranch=master init
          git remote add origin "$INPUTS_GIT_URL"
          git fetch --depth 1 origin "$INPUTS_VERSION"
          git checkout "$INPUTS_VERSION"
        fi
      env:
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_GIT_URL: ${{ inputs.git_url }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: bootstrap-posix
      if: ${{ runner.os != 'Windows' || (runner.os == 'Windows' && inputs.msys2_msystem != '') }}
      shell: ${{ (matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash') }}
      run: |
        set -eux
        cd "$GITHUB_ACTION_PATH/muon"
        ./bootstrap.sh build
        build/muon-bootstrap setup build
        build/muon-bootstrap -C build samu
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: bootstrap-windows-msvc
      if: ${{ runner.os == 'Windows' && inputs.msys2_msystem == '' }}
      shell: cmd
      run: |
        @echo on
        cd "%GITHUB_ACTION_PATH%/muon"
        for /f "tokens=*" %%g in (
        '"C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath'
        ) do (set installation_path=%%g)
        call "%installation_path%/VC/Auxiliary/Build/vcvarsall" amd64 && bootstrap build && build\muon-bootstrap setup -Dvsenv=true build && build\muon-bootstrap -C build samu
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: install
      shell: bash
      run: |
        set -eux
        cd "$GITHUB_ACTION_PATH/muon"
        export DESTDIR="$GITHUB_ACTION_PATH"
        build/muon-bootstrap -C build install
        echo "$DESTDIR/usr/local/bin" >> $GITHUB_PATH
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
