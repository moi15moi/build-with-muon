name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-action:
    strategy:
      matrix:
        image:
          - ubuntu-latest
          - macos-latest
          - windows-latest

        # Test the 3 cases for version
        version:
          - edge
          - 6328c3d69f2bc0ae8a8b5903cb36fe4b46b702c4
          - 0.4.0
    name: ${{ matrix.image }}/${{ matrix.version }}
    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Run action
        id: test-action
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check muon is installed
        id: output
        run: muon version

  test-action-msys2:
    strategy:
      matrix:
        # Test the 3 cases for version
        version:
          - edge
          - 6328c3d69f2bc0ae8a8b5903cb36fe4b46b702c4
          - 0.4.0

        msys2_msystem:
          - ucrt64
          - clang64

        include:
          - msys2_msystem: ucrt64
            cc: gcc
          - msys2_msystem: clang64
            cc: clang

    name: msys2 (${{ matrix.msys2_msystem }}) - ${{ matrix.version }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2_msystem }}
          pacboy: >-
            toolchain

      - name: Run action
        uses: ./
        with:
          version: ${{ matrix.version }}
          cc: ${{ matrix.cc }}

      - name: Check muon is installed
        id: output
        run: muon version
